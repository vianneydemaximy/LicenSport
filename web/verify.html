<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification de licence - LicenSport</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav id="nav"></nav>
    <a href="/">LicenSport</a><small>vérification de licence</small>
  </header>
  <main>
    <div id="status" class="status wait"><div class="big">Vérification…</div></div>
    <h2>Parcours de la licence</h2>
    <div id="pipeline"></div>
    <div id="holder" style="margin-top:16px"></div>
    <div class="card" style="margin-top:16px">
      <dl id="details"></dl>
      <div class="notice">La blockchain prouve que la licence est authentique, pas que la personne présente en est la titulaire : comparez la photo avec le sportif.</div>
    </div>
    <h2>Historique</h2>
    <div class="card compact-card" id="history"><span class="muted small">Chargement…</span></div>
    <footer id="footer"></footer>
  </main>
  <script src="common.js"></script>
  <script src="pipeline.js"></script>
  <script src="verify.js"></script>
</body>
</html>
