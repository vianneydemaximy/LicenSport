<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification de licence - LicenSport</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a href="/">LicenSport</a><small>vérification de licence</small></header>
  <main>
    <div id="status" class="status wait"><div class="big">Vérification…</div></div>
    <div id="holder"></div>
    <div class="card" style="margin-top:16px">
      <dl id="details"></dl>
      <div class="notice">La blockchain prouve que la licence est authentique, pas que la personne présente en est la titulaire : comparez la photo avec le sportif.</div>
    </div>
    <h2>Historique (parcours de club en club)</h2>
    <div class="card"><ul class="timeline" id="history"><li class="muted">Chargement…</li></ul></div>
    <footer id="footer"></footer>
  </main>
  <script src="verify.js"></script>
</body>
</html>
